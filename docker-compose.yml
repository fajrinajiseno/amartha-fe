version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: amartha-web
    container_name: amartha-web
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_SERVER1_BASE_URL: http://server1:4001
      NEXT_PUBLIC_SERVER2_BASE_URL: http://server2:4002
    depends_on:
      - server1
      - server2
    restart: unless-stopped

  server1:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: amartha-server1
    container_name: amartha-server1
    command: pnpm server1
    ports:
      - "4001:4001"
    restart: unless-stopped

  server2:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: amartha-server2
    container_name: amartha-server2
    command: pnpm server2
    ports:
      - "4002:4002"
    restart: unless-stopped
